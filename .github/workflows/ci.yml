name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: hooklane
          POSTGRES_PASSWORD: integration_local
          POSTGRES_DB: hooklane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hooklane -d hooklane_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: make install
      - run: make check
      - run: make build
      - run: make integration
        env:
          HOOKLANE_TEST_DATABASE_URL: postgres://hooklane:integration_local@127.0.0.1:5432/hooklane_test?sslmode=disable
      - run: make generate
      - name: Check dependency metadata and tracked files
        run: |
          go mod tidy
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: make smoke
