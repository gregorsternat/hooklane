name: hooklane

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8088"
    environment:
      DATABASE_URL: "host=db port=5432 sslmode=disable"
      PGUSER: "${POSTGRES_USER:-hooklane}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-hooklane_local}"
      PGDATABASE: "${POSTGRES_DB:-hooklane}"
      HTTP_ADDR: "0.0.0.0:8088"
      WEB_DIR: /app/web
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      READINESS_TIMEOUT: "${READINESS_TIMEOUT:-2s}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?Run make setup to generate ADMIN_TOKEN}"
      INGEST_TOKEN: "${INGEST_TOKEN:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Run make setup to generate ENCRYPTION_KEY}"
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
      MAX_PAYLOAD_BYTES: "${MAX_PAYLOAD_BYTES:-1048576}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      DELIVERY_TIMEOUT: "${DELIVERY_TIMEOUT:-10s}"
      WORKER_POLL_INTERVAL: "${WORKER_POLL_INTERVAL:-1s}"
      RETRY_BASE: "${RETRY_BASE:-5s}"
      MAX_ATTEMPTS: "${MAX_ATTEMPTS:-8}"
      RETENTION: "${RETENTION:-720h}"
      ALLOW_HTTP_DESTINATIONS: "${ALLOW_HTTP_DESTINATIONS:-false}"
      DESTINATION_ALLOWED_CIDRS: "${DESTINATION_ALLOWED_CIDRS:-}"

    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-hooklane}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hooklane_local}"
      POSTGRES_DB: "${POSTGRES_DB:-hooklane}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
